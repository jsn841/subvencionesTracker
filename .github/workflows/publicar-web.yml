# Publica la web en GitHub Pages.
# Se ejecuta cuando cambia el código de la web en "main" y al terminar cada actualización de datos.
name: Publicar web

on:
  push:
    branches: [main]
    paths-ignore: ["data/**"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar la carpeta de la web
        run: |
          mkdir -p _site
          cp -r index.html metodologia.html assets data _site/
          rm -f _site/data/bdns/_convocatorias.json
          touch _site/.nojekyll
          # Fuerza a los navegadores a descargar la versión nueva de estilos y código en cada publicación
          v="${GITHUB_SHA::8}"
          sed -i "s#assets/style.css#assets/style.css?v=$v#; s#assets/app.js#assets/app.js?v=$v#; s#assets/vendor/echarts.min.js#assets/vendor/echarts.min.js?v=$v#" _site/index.html
          sed -i "s#assets/style.css#assets/style.css?v=$v#" _site/metodologia.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
